[package]
name = "craftoffice-sketch"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CraftOffice Sketch: drawing and sketching with layers, brushes and shapes (by AndyBcx)"

[[bin]]
name = "sketch"
path = "src/main.rs"

[lib]
name = "craftoffice_sketch"
path = "src/lib.rs"

[dependencies]
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
rfd = "0.15"
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Navigator", "HtmlInputElement", "FileList", "File", "Event", "EventTarget"] }
rfd = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

