name: build

# CraftOffice: a launcher és a 16 alkalmazás Windows-os fordítása a GitHub gépein (MSVC),
# ugyanúgy, mint a Vormantis. Indítás: Actions → build → Run workflow (vagy push a main ágra).

# Csak kézzel indul (Actions → build → Run workflow), feltöltéskor nem.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Csak ez az app (pl. anicraft); üresen mind'
        required: false
        default: ''

env:
  LO_DICT_REF: c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb
  LO_CORE_REF: d9b2d316ec4d546f831415aa75514fa237f1fda4
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  EGUI_REF: 6d518fc799681571963842f95b55a6b68431b15a
  I18N_REF: e56d26244bbac099bfd42e23fb12f78a4be418a7
  CARGO_TERM_COLOR: never

jobs:
  launcher:
    if: ${{ !inputs.only || inputs.only == 'craftoffice' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build CraftOffice launcher
        shell: bash
        run: |
          tar xzf bundle/launcher-src.tar.gz
          cd craftoffice
          if [ -f ../extra/launcher.patch ]; then git apply --whitespace=nowarn ../extra/launcher.patch; fi
          cargo build --release
          mkdir -p ../out
          cp target/release/craftoffice.exe ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: app-craftoffice
          path: out/

  sketch:
    if: ${{ !inputs.only || inputs.only == 'sketch' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build CraftOffice Sketch
        shell: bash
        run: |
          cd sketch
          cargo build --release
          V=$(cargo pkgid | sed -E 's/.*[#@]([0-9][^#@]*)$/\1/')
          N="CraftOffice Sketch"
          mkdir -p "../out/apps/$N"
          cp target/release/sketch.exe "../out/apps/$N/$N.exe"
          printf '{"id":"sketch","version":"%s","exe":"%s.exe"}' "$V" "$N" > "../out/apps/$N/craftoffice.json"
      - uses: actions/upload-artifact@v4
        with:
          name: app-sketch
          path: out/

  photocalendar:
    # CraftOffice PhotoCalendar: its source is bundle/photocalendar-src.tar.gz
    if: ${{ !inputs.only || inputs.only == 'photocalendar' }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build CraftOffice PhotoCalendar
        shell: bash
        run: |
          set -e
          tar xzf bundle/photocalendar-src.tar.gz
          cd photocalendar-main
          sh scripts/get-fonts.sh
          cargo build --release --bin photocalendar
          V=$(cargo pkgid | sed -E 's/.*[#@]([0-9][^#@]*)$/\1/')
          N="CraftOffice PhotoCalendar"
          mkdir -p "../out/apps/$N"
          cp target/release/photocalendar.exe "../out/apps/$N/$N.exe"
          printf '{"id":"photocalendar","version":"%s","exe":"%s.exe"}' "$V" "$N" > "../out/apps/$N/craftoffice.json"
      - uses: actions/upload-artifact@v4
        with:
          name: app-photocalendar
          path: out/

  app:
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { app: wordcraft,      src: tar:wordcraft-main }
          - { app: gridcraft,      src: tar:gridcraft-main }
          - { app: pdfcraft,       src: rebase:9b3e6d6f38de906c758d93e8ece45cbf105fd515:6e910675c68dd5092e889065cfe8d0274c1b2742, i18n: 866aff71dd63d8369eb100b9c432b5af1400c22a }
          - { app: photocraft,     src: rebase:45066c48292e92229ada3459a83453439514c83d:27c629f78903a483cc8de1c111758bd7296ebbed, i18n: e02939ef009218e81c44e8ec001fbb7603461de4 }
          - { app: deckcraft,      src: rebase:7cc73ab1895ed2e30c8afbcada20c70b9ea0a440:9db2fa0ca994ad8ae8d9cc5032d860ae985477d5 }
          - { app: designcraft,    src: rebase:33a467872268c98536231491865b4011b0275b17:39651f6603ee2aec709c676e4a7b76e350ea1dcc }
          - { app: vectorcraft,    src: rebase:f4922aa7ac99a4f6d56fc68a83a44945207ec610:18d2939ffccf68ac1aa66e78622461fcee0002d5 }
          - { app: lightcraft,     src: rebase:361e3bc0c838ffe5e5cea515b1fe5b71951989c6:5a29fe602b5a2680d6771890a43380cd6bc34558 }
          - { app: filmcraft,      src: rebase:cedf0c9bd060eb06a977d532402be2097c9ebe42:ba6fe10529c7bf5d2a9283f9de2e35c0ccff926c }
          - { app: effectcraft,    src: rebase:582344dd4ef462362c02e56e3094de7af01847ab:86af5cba7f6976fe2b4561df4e8021ba807591f5 }
          - { app: soundcraft,     src: rebase:a52bbdccbe15342f44e0de1906bf71a621e7a68f:7391fc7465b45f0159c8044a521d77b0a309de7f }
          - { app: anicraft,       src: rebase:d0beaf253274948b55ee9e1107749f9491bff880:837c3edfd69956a41c1bda21db2718a67dfb5ee6 }
          - { app: figcraft,       src: rebase:4acc293c2ec941ac1400837ee7e3ab51780399f8:c01d391df75cc7a9f04bf3879722770727d89f8d }
          - { app: cadcraft,       src: rebase:7526dc62c14e71b3c8d46e73bbf1fa29ef506af1:ddb9a424ef4af8191e668009cf930c9f4a8435f3 }
          - { app: materialcraft,  src: rebase:65f7bfd3e5f40d695d03162285879f0f8079ff6c:356c066e838c1f8ae31dce8a0ab370d889c8f868 }
          - { app: texturecraft,   src: rebase:34a196190fe2daa2f43017a0f32b254cca4836f2:021ff6fe8b04760a4d75b54e03d088f8e4b3828c }
          - { app: craft-anything, src: rebase:3d5eb2577397ac632fb6dfffd94aa9787ad17acc:572877eded9911e523a0d70ffc6207a1d4c31ba6 }
    steps:
      - name: Git settings
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        if: ${{ !inputs.only || inputs.only == matrix.app }}
      - name: Prepare sources
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        shell: bash
        run: |
          set -e
          W=$(cygpath -m "$GITHUB_WORKSPACE")
          fetch() { mkdir -p "$2"; git -C "$2" init -q; git -C "$2" fetch -q --depth 1 "https://github.com/storytold/$1.git" "$3"; git -C "$2" checkout -q FETCH_HEAD; }
          tar xzf bundle/patches.tar.gz
          tar xzf bundle/egui036.tar.gz
          fetch craft-fonts craft-fonts "$CRAFT_FONTS_REF"
          fetch egui egui-hook "$EGUI_REF"
          git -C egui-hook apply --whitespace=nowarn "$W/patches/egui.patch"
          # one "About" for all apps: the CraftOffice version beside each app's own
          PY=$(command -v python3 || command -v python); "$PY" extra/egui_about.py VERSION egui-hook/crates/egui/src/widget_text.rs egui-hook-036/src/widget_text.rs
          REF="${{ matrix.i18n }}"
          if [ -z "$REF" ]; then
            fetch craft-i18n craft-i18n "$I18N_REF"
            git -C craft-i18n apply --whitespace=nowarn "$W/patches/craft-i18n.patch"
            if [ -f extra/craft-i18n.patch ]; then git -C craft-i18n apply --whitespace=nowarn "$W/extra/craft-i18n.patch"; fi
          else
            fetch craft-i18n craft-i18n "$REF"
            # an app with its own translations version: CraftOffice's additions to it
            if [ -f "extra/craft-i18n-${{ matrix.app }}.patch" ]; then git -C craft-i18n apply --whitespace=nowarn "$W/extra/craft-i18n-${{ matrix.app }}.patch"; fi
          fi
          SRC="${{ matrix.src }}"
          case "$SRC" in
            tar:*) tar xzf "bundle/${{ matrix.app }}-src.tar.gz"; mv "${SRC#tar:}" appsrc ;;
            git:*) fetch "${{ matrix.app }}" appsrc "${SRC#git:}"
                   git -C appsrc apply --whitespace=nowarn "$W/patches/${{ matrix.app }}.patch" ;;
            # a newer ArtCraft revision: CraftOffice's patch (made on the older one) carried over
            rebase:*) R="${SRC#rebase:}"; REBASED=1
                   "$PY" extra/rebase_app.py "${{ matrix.app }}" "${R%%:*}" "${R#*:}" appsrc "$W/patches/${{ matrix.app }}.patch" "$W/extra/${{ matrix.app }}.patch" ;;
          esac
          # CraftOffice-bővítések (extra/<app>.patch; a rebased app has that one already)
          for P in "extra/${{ matrix.app }}.patch" extra/${{ matrix.app }}-[0-9]*.patch; do
            if [ -n "${REBASED:-}" ] && [ "$P" = "extra/${{ matrix.app }}.patch" ]; then continue; fi
            if [ -f "$P" ]; then echo "extra: $P"; (cd appsrc && git apply --whitespace=nowarn "$W/$P"); fi
          done
          # AniCraft: a CraftOffice mod-sorok a belső attribútumok mögé
          [ -f appsrc/src/main.rs ] && perl -0pi -e 's/(mod craftoffice_brand;\r?\nmod craftoffice_i18n;\r?\n)(.*?#!\[cfg_attr\(target_arch = "wasm32", allow\(dead_code\)\)\]\r?\n)/$2$1/s' appsrc/src/main.rs || true
          # an app ArtCraft moved to a newer egui: CraftOffice's hooked egui on that revision too
          "$PY" extra/egui_hooks.py appsrc "$W" "$W/patches/egui.patch" VERSION
          # a helyi gépen használt útvonalak cseréje a GitHub gép útvonalára
          find appsrc -name Cargo.toml -not -path "*/target/*" -print0 | xargs -0 sed -i "s#/home/claude/#$W/#g"
          echo "CRAFT_I18N_DIR=$W/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_DIR=$W/craft-fonts" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.app }}
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        shell: bash
        working-directory: appsrc
        run: cargo build --release -p ${{ matrix.app }}
      - name: Package
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        shell: bash
        run: |
          A="${{ matrix.app }}"
          case "$A" in
            craftoffice) N="CraftOffice" ;; wordcraft) N="CraftOffice Writer" ;; gridcraft) N="CraftOffice Sheets" ;;
            deckcraft) N="CraftOffice Slides" ;; designcraft) N="CraftOffice Layout" ;; pdfcraft) N="CraftOffice PDF" ;;
            photocraft) N="CraftOffice Photo" ;; vectorcraft) N="CraftOffice Vector" ;; lightcraft) N="CraftOffice Darkroom" ;;
            filmcraft) N="CraftOffice Video" ;; effectcraft) N="CraftOffice Motion" ;; soundcraft) N="CraftOffice Audio" ;;
            anicraft) N="CraftOffice Animation" ;; figcraft) N="CraftOffice Prototype" ;; cadcraft) N="CraftOffice CAD" ;;
            materialcraft) N="CraftOffice Material" ;; texturecraft) N="CraftOffice Texture" ;; craft-anything) N="CraftOffice Workshop" ;;
          esac
          V=$(cd appsrc && cargo pkgid -p "$A" | sed -E 's/.*[#@]([0-9][^#@]*)$/\1/')
          mkdir -p "out/apps/$N"
          cp "appsrc/target/release/$A.exe" "out/apps/$N/$N.exe"
          printf '{"id":"%s","version":"%s","exe":"%s.exe"}' "$A" "$V" "$N" > "out/apps/$N/craftoffice.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        with:
          name: app-${{ matrix.app }}
          path: out/

  dicts:
    # The Hungarian and Romanian dictionaries (spelling, hyphenation, thesaurus, AutoCorrect) for the package's
    # `szotarak` folder: the launcher hands them to Writer and the other apps. LibreOffice's, pinned.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dictionaries
        shell: bash
        run: |
          set -e
          B="https://raw.githubusercontent.com/LibreOffice/dictionaries/$LO_DICT_REF"
          mkdir -p out/szotarak
          for f in hu_HU/hu_HU.aff hu_HU/hu_HU.dic hu_HU/hyph_hu_HU.dic hu_HU/th_hu_HU_v2.dat \
                   ro/ro_RO.aff ro/ro_RO.dic ro/hyph_ro_RO.dic ro/th_ro_RO_v2.dat; do
            curl -fsSL -o "out/szotarak/$(basename "$f")" "$B/$f" || echo "missing: $f"
          done
          # AutoCorrect lists (LibreOffice's), which Writer also reads from here
          python3 extra/acor_lists.py out/szotarak
          ls -la out/szotarak
      - uses: actions/upload-artifact@v4
        with:
          name: app-dicts
          path: out/

  tools:
    # FFmpeg for Video › Compress Video (AV1 / H.265 / H.264 at constant visual quality), in the
    # package's `tools` folder. BtbN's GPL build of the FFmpeg 8.1 release branch; only ffmpeg itself.
    runs-on: ubuntu-latest
    steps:
      - name: FFmpeg
        shell: bash
        run: |
          set -e
          mkdir -p out/tools
          curl -fsSL -o ff.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          unzip -q ff.zip
          cp ffmpeg-*/bin/ffmpeg.exe out/tools/
          cp ffmpeg-*/LICENSE.txt out/tools/FFmpeg-LICENSE.txt 2>/dev/null || true
          printf 'FFmpeg (https://ffmpeg.org), GPL build by BtbN (https://github.com/BtbN/FFmpeg-Builds), release 8.1.\nUsed by CraftOffice Video for Compress Video.\n' > out/tools/FFmpeg-README.txt
          ls -la out/tools
      - uses: actions/upload-artifact@v4
        with:
          name: app-tools
          path: out/

  package:
    needs: [launcher, sketch, app, dicts, tools, photocalendar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: craftoffice-windows-x64
          pattern: app-*

