name: build-linux

# CraftOffice: a launcher és a 16 alkalmazás Linux (Ubuntu) fordítása a GitHub gépein.
# Indítás kézzel: Actions → build-linux → Run workflow (only: egy app neve, vagy üres).

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Csak ez az app (pl. anicraft); üresen mind'
        required: false
        default: ''

env:
  LO_DICT_REF: c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb
  LO_CORE_REF: d9b2d316ec4d546f831415aa75514fa237f1fda4
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  EGUI_REF: 6d518fc799681571963842f95b55a6b68431b15a
  I18N_REF: e56d26244bbac099bfd42e23fb12f78a4be418a7
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        app: [craftoffice, sketch, wordcraft, gridcraft, pdfcraft, photocraft, deckcraft, designcraft, vectorcraft, lightcraft, filmcraft, effectcraft, soundcraft, anicraft, figcraft, cadcraft, materialcraft, texturecraft, craft-anything]
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.only || inputs.only == matrix.app }}
      - name: System packages
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libasound2-dev libudev-dev libssl-dev \
            libfontconfig1-dev libdbus-1-dev clang cmake nasm
      - name: Prepare and build
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        shell: bash
        run: |
          set -e
          W="$GITHUB_WORKSPACE"
          fetch() { mkdir -p "$2"; git -C "$2" init -q; git -C "$2" fetch -q --depth 1 "https://github.com/storytold/$1.git" "$3"; git -C "$2" checkout -q FETCH_HEAD; }
          A="${{ matrix.app }}"
          mkdir -p out
          if [ "$A" = craftoffice ]; then
            tar xzf bundle/launcher-src.tar.gz; cd craftoffice
            if [ -f "$W/extra/launcher.patch" ]; then git apply --whitespace=nowarn "$W/extra/launcher.patch"; fi
            cargo build --release
            cp target/release/craftoffice "$W/out/craftoffice"; exit 0
          fi
          if [ "$A" = sketch ]; then
            # CraftOffice Sketch: its own source in this repository
            cd sketch; cargo build --release
            V=$(cargo pkgid | sed -E 's/.*[#@]([0-9][^#@]*)$/\1/')
            N="CraftOffice Sketch"; mkdir -p "$W/out/apps/$N"
            strip -o "$W/out/apps/$N/$N" target/release/sketch
            printf '{"id":"sketch","version":"%s","exe":"%s"}' "$V" "$N" > "$W/out/apps/$N/craftoffice.json"
            exit 0
          fi
          SRC=$(grep -E "^ *- \\{ app: $A," .github/workflows/build.yml | head -1 | sed -E 's/.*src: ([^ ,}]+).*/\1/')
          I18=$(grep -E "^ *- \\{ app: $A," .github/workflows/build.yml | head -1 | grep -oE "i18n: [0-9a-f]+" | cut -d' ' -f2 || true)
          tar xzf bundle/patches.tar.gz; tar xzf bundle/egui036.tar.gz
          fetch craft-fonts craft-fonts "$CRAFT_FONTS_REF"
          fetch egui egui-hook "$EGUI_REF"; git -C egui-hook apply --whitespace=nowarn "$W/patches/egui.patch"
          if [ -z "$I18" ]; then fetch craft-i18n craft-i18n "$I18N_REF"; git -C craft-i18n apply --whitespace=nowarn "$W/patches/craft-i18n.patch"
            if [ -f extra/craft-i18n.patch ]; then git -C craft-i18n apply --whitespace=nowarn "$W/extra/craft-i18n.patch"; fi
          else fetch craft-i18n craft-i18n "$I18"
            if [ -f "extra/craft-i18n-$A.patch" ]; then git -C craft-i18n apply --whitespace=nowarn "$W/extra/craft-i18n-$A.patch"; fi
          fi
          case "$SRC" in
            tar:*) tar xzf "bundle/$A-src.tar.gz"; mv "${SRC#tar:}" appsrc ;;
            git:*) fetch "$A" appsrc "${SRC#git:}"; git -C appsrc apply --whitespace=nowarn "$W/patches/$A.patch" ;;
          esac
          for P in "extra/$A.patch" extra/$A-[0-9]*.patch; do
            if [ -f "$P" ]; then echo "extra: $P"; (cd appsrc && git apply --whitespace=nowarn "$W/$P"); fi
          done
          # AniCraft: a CraftOffice mod-sorok a belső attribútumok mögé
          [ -f appsrc/src/main.rs ] && perl -0pi -e 's/(mod craftoffice_brand;\r?\nmod craftoffice_i18n;\r?\n)(.*?#!\[cfg_attr\(target_arch = "wasm32", allow\(dead_code\)\)\]\r?\n)/$2$1/s' appsrc/src/main.rs || true
          find appsrc -name Cargo.toml -not -path "*/target/*" -print0 | xargs -0 sed -i "s#/home/claude/#$W/#g"
          export CRAFT_I18N_DIR="$W/craft-i18n" CRAFT_FONTS_DIR="$W/craft-fonts"
          cd appsrc && cargo build --release -p "$A"
          cd "$W"
          case "$A" in
            craftoffice) N="CraftOffice" ;; wordcraft) N="CraftOffice Writer" ;; gridcraft) N="CraftOffice Sheets" ;;
            deckcraft) N="CraftOffice Slides" ;; designcraft) N="CraftOffice Layout" ;; pdfcraft) N="CraftOffice PDF" ;;
            photocraft) N="CraftOffice Photo" ;; vectorcraft) N="CraftOffice Vector" ;; lightcraft) N="CraftOffice Darkroom" ;;
            filmcraft) N="CraftOffice Video" ;; effectcraft) N="CraftOffice Motion" ;; soundcraft) N="CraftOffice Audio" ;;
            anicraft) N="CraftOffice Animation" ;; figcraft) N="CraftOffice Prototype" ;; cadcraft) N="CraftOffice CAD" ;;
            materialcraft) N="CraftOffice Material" ;; texturecraft) N="CraftOffice Texture" ;; craft-anything) N="CraftOffice Workshop" ;;
          esac
          V=$(cd appsrc && cargo pkgid -p "$A" | sed -E 's/.*[#@]([0-9][^#@]*)$/\1/')
          mkdir -p "out/apps/$N"
          strip -o "out/apps/$N/$N" "appsrc/target/release/$A"
          printf '{"id":"%s","version":"%s","exe":"%s"}' "$A" "$V" "$N" > "out/apps/$N/craftoffice.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.only || inputs.only == matrix.app }}
        with:
          name: linux-${{ matrix.app }}
          path: out/

  dicts:
    # The Hungarian and Romanian dictionaries (spelling, hyphenation, thesaurus, AutoCorrect) for the package's
    # `szotarak` folder: the launcher hands them to Writer and the other apps. LibreOffice's, pinned.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dictionaries
        shell: bash
        run: |
          set -e
          B="https://raw.githubusercontent.com/LibreOffice/dictionaries/$LO_DICT_REF"
          mkdir -p out/szotarak
          for f in hu_HU/hu_HU.aff hu_HU/hu_HU.dic hu_HU/hyph_hu_HU.dic hu_HU/th_hu_HU_v2.dat \
                   ro/ro_RO.aff ro/ro_RO.dic ro/hyph_ro_RO.dic ro/th_ro_RO_v2.dat; do
            curl -fsSL -o "out/szotarak/$(basename "$f")" "$B/$f" || echo "missing: $f"
          done
          # AutoCorrect lists (LibreOffice's), which Writer also reads from here
          python3 extra/acor_lists.py out/szotarak
          ls -la out/szotarak
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dicts
          path: out/

  package-linux:
    needs: [linux, dicts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: craftoffice-linux-x86_64
          pattern: linux-*
